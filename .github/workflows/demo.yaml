name: Event Demo
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main1
      - "dev-*" # start with dev-team1
      - "feature/**" #for more feature/auth/login
  workflow_dispatch:
  push:
    branches:
      - main1
      - "dev-*" # start with dev-team1
      - "feature/**" #for more feature/auth/login
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Output event data
        run: echo "${{ toJson(github.event) }}"
      - name: Get code
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Test code
        run: npm run test
      - name: build code
        run: npm run build
      - name: Deploy code
        run: echo "Deploying ...."
